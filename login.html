<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — LudoThéraCoach</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="nav">
    <a href="index.html" class="brand">
      <img src="assets/logo-isabelle.png" alt="Logo LudoThéraCoach" style="width:34px; height:34px; object-fit:contain; border-radius:50%;">
      <span class="brand-text">Isabelle Filleul<span>LudoThéraCoach</span></span>
    </a>
    <nav class="links">
      <a href="index.html">Accueil</a>
      <a href="isabelle.html">Isabelle</a>
      <a href="activites.html">Activités</a>
      <a href="contact.html">Contact</a>
    </nav>
    <a href="login.html" class="nav-cta">Espace privé</a>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">espace privé</span>
    <h1>Connexion</h1>

    <div id="login-msg" class="auth-msg"></div>

    <form id="login-form">
      <div class="field">
        <label for="login-identifiant">Identifiant</label>
        <input type="text" id="login-identifiant" required placeholder="ex. marie.d">
      </div>
      <div class="field">
        <label for="login-password">Mot de passe</label>
        <div style="position:relative;">
          <input type="password" id="login-password" required placeholder="••••••••" style="width:100%; padding-right:44px;">
          <button type="button" id="toggle-password" aria-label="Afficher le mot de passe"
            style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:1.1rem; padding:4px;">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
    </form>

    <p style="font-size:.85rem; color:var(--ink-soft); margin-top:16px;">Connecte-toi avec les identifiants qui t'ont été communiqués.</p>

    <div class="auth-link">
      <a href="#" id="reset-link">Mot de passe oublié ?</a>
    </div>
  </div>
</div>

<script>
  document.getElementById("toggle-password").addEventListener("click", function(){
    const input = document.getElementById("login-password");
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    this.textContent = showing ? "👁️" : "🙈";
    this.setAttribute("aria-label", showing ? "Afficher le mot de passe" : "Masquer le mot de passe");
  });
</script>

<footer>
  <div class="container">
    <span class="brand-text">Isabelle Filleul — LudoThéraCoach<span>Thérapie · Atelier des émotions · Formations</span></span>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>initLoginPage();</script>
</body>
</html>
