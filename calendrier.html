<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon calendrier — LudoThéraCoach</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dash-header">
  <div class="container">
    <div class="dash-toprow">
    <div class="who">
      <span class="role-badge membre" data-user-role>Membre</span>
      <span data-user-name>...</span>
    </div>
    <a href="#" class="logout-link" onclick="logoutUser()">Se déconnecter</a>
    </div>
    <nav class="dash-subnav">
      <a href="membre.html">Mon espace</a>
      <a href="fiche.html">Ma fiche</a>
      <a href="calendrier.html">Mon calendrier</a>
      <a href="rdv-membre.html">Événements / RDV</a>
    </nav>
  </div>
</div>

<div class="dash-body">
  <div class="container">

    <div class="section-head">
      <span class="eyebrow">mon suivi</span>
      <h2>Mon calendrier</h2>
    </div>

    <div id="calendrier-contenu">Chargement…</div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
guardRole("membre");

auth.onAuthStateChanged(async (user) => {
  if(!user) return;
  const zone = document.getElementById("calendrier-contenu");
  const suivisSnap = await db.collection("suivis").where("membreUid","==",user.uid).get();

  if(suivisSnap.empty){
    zone.innerHTML = `<div class="dash-card"><p>Aucun suivi n'a encore été défini par Isabelle. Il apparaîtra ici dès que ce sera fait.</p></div>`;
    return;
  }

  let html = "";
  const suivis = suivisSnap.docs.map(d => d.data());

  // ---- thérapie individuelle (une seule section même si plusieurs suivis "individuel") ----
  if(suivis.some(s => s.type === "individuel")){
    const snap = await db.collection("disponibilites").orderBy("date").get();
    const mesCreneaux = [];
    const disponibles = [];
    snap.forEach(doc => {
      const d = doc.data();
      if(d.reserve && d.membreUid === user.uid) mesCreneaux.push({ id: doc.id, ...d });
      else if(!d.reserve) disponibles.push({ id: doc.id, ...d });
    });

    html += `<div class="dash-card" style="--accent:var(--turquoise); margin-bottom:20px;">
      <span class="tag" style="color:var(--turquoise);">Thérapie individuelle</span>`;
    html += `<h3 style="font-size:.95rem;">Mes rendez-vous</h3>`;
    html += mesCreneaux.length
      ? `<table class="table" style="margin-bottom:18px;"><thead><tr><th>Date</th><th>Horaire</th></tr></thead><tbody>` +
        mesCreneaux.map(c => `<tr><td>${c.date}</td><td>${c.heureDebut} – ${c.heureFin}</td></tr>`).join("") + `</tbody></table>`
      : `<p>Aucun rendez-vous réservé pour l'instant.</p>`;

    html += `<h3 style="font-size:.95rem;">Créneaux disponibles</h3>`;
    html += disponibles.length
      ? `<table class="table"><thead><tr><th>Date</th><th>Horaire</th><th></th></tr></thead><tbody>` +
        disponibles.map(c => `<tr><td>${c.date}</td><td>${c.heureDebut} – ${c.heureFin}</td><td><button class="btn-small" onclick="reserverCreneau('${c.id}', '${user.uid}')">Réserver</button></td></tr>`).join("") + `</tbody></table>`
      : `<p>Aucun créneau libre pour le moment.</p>`;
    html += `</div>`;
  }

  // ---- un bloc par atelier / formation ----
  for(const s of suivis){
    if(s.type !== "atelier" && s.type !== "formation") continue;
    if(!s.eventId){
      html += `<div class="dash-card" style="margin-bottom:16px;"><p>Un suivi ${s.type === "atelier" ? "atelier" : "formation"} est prévu, mais aucune session n'y est encore associée.</p></div>`;
      continue;
    }
    const evtDoc = await db.collection("evenements").doc(s.eventId).get();
    if(!evtDoc.exists){
      html += `<div class="dash-card" style="margin-bottom:16px;"><p>La session associée n'est plus disponible.</p></div>`;
      continue;
    }
    const e = evtDoc.data();
    html += `<div class="dash-card" style="--accent:${s.type === "atelier" ? "var(--gold)" : "var(--mauve)"}; max-width:440px; margin-bottom:16px;">
      <span class="tag">${s.type === "atelier" ? "Atelier des émotions" : "Formation"}</span>
      <h3>${e.titre}</h3>
      <p>${e.date} · ${e.heureDebut} – ${e.heureFin}</p>
      <p>📍 ${e.lieu}</p>
      ${e.description ? `<p>${e.description}</p>` : ""}
    </div>`;
  }

  zone.innerHTML = html;
});

async function reserverCreneau(id, uid){
  const userDoc = await db.collection("users").doc(uid).get();
  const nom = userDoc.exists ? (userDoc.data().nom || "") : "";
  await db.collection("disponibilites").doc(id).update({ reserve: true, membreUid: uid, membreNom: nom });
  location.reload();
}
</script>
</body>
</html>
